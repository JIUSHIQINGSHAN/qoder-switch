[package]
name = "qs-switch-core"
version = "0.1.5"
edition = "2021"
description = "Qoder Switch 核心逻辑（档位/凭据布局/快照/备份回滚/切换），不依赖 Tauri，可被桌面端与 HTTP server 复用"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
